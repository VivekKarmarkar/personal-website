<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Website Hosting Architecture</title>
<style>
  body {
    background: #111827;
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
    color: white;
  }
  h2 {
    font-size: 16px;
    font-weight: 400;
    color: #9ca3af;
    margin-bottom: 40px;
  }
  svg {
    filter: drop-shadow(0 4px 24px rgba(0,0,0,0.3));
  }
  .legend {
    margin-top: 32px;
    display: flex;
    gap: 32px;
    font-size: 14px;
    color: #9ca3af;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
</style>
</head>
<body>

<h1>How Your Website Gets to the World</h1>
<h2>From git push to a user's browser</h2>

<svg width="1100" height="820" viewBox="0 0 1100 820">
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF6319"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0039A6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6CBE45"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ADD8"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- ==================== STAGE 1: YOUR LAPTOP ==================== -->
  <g transform="translate(100, 60)">
    <!-- Card -->
    <rect width="200" height="120" rx="12" fill="url(#card-bg)" stroke="#374151" stroke-width="1.5"/>
    <!-- Laptop icon -->
    <g transform="translate(70, 18)">
      <rect x="8" y="0" width="44" height="30" rx="3" fill="none" stroke="#FF6319" stroke-width="2"/>
      <rect x="0" y="32" width="60" height="4" rx="2" fill="#FF6319"/>
    </g>
    <!-- Text -->
    <text x="100" y="72" text-anchor="middle" fill="white" font-size="15" font-weight="600">Your Laptop</text>
    <text x="100" y="92" text-anchor="middle" fill="#9ca3af" font-size="11">Source code: .jsx, .tsx</text>
    <text x="100" y="106" text-anchor="middle" fill="#9ca3af" font-size="11">Tailwind, MP3s, images</text>
  </g>

  <!-- Arrow 1: Laptop → GitHub -->
  <line x1="300" y1="120" x2="445" y2="120" stroke="#FF6319" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="372" y="108" text-anchor="middle" fill="#FF6319" font-size="12" font-weight="600">git push</text>

  <!-- ==================== STAGE 2: GITHUB ==================== -->
  <g transform="translate(450, 60)">
    <rect width="200" height="120" rx="12" fill="url(#card-bg)" stroke="#374151" stroke-width="1.5"/>
    <!-- GitHub icon (simplified octocat) -->
    <g transform="translate(75, 14)">
      <circle cx="25" cy="18" r="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>
      <circle cx="19" cy="15" r="2" fill="#e5e7eb"/>
      <circle cx="31" cy="15" r="2" fill="#e5e7eb"/>
      <path d="M18 23 Q25 28 32 23" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
    </g>
    <text x="100" y="72" text-anchor="middle" fill="white" font-size="15" font-weight="600">GitHub</text>
    <text x="100" y="92" text-anchor="middle" fill="#9ca3af" font-size="11">Owned by Microsoft</text>
    <text x="100" y="106" text-anchor="middle" fill="#9ca3af" font-size="11">Stores repo on their hard drives</text>
  </g>

  <!-- Arrow 2: GitHub → Vercel Build -->
  <line x1="550" y1="180" x2="550" y2="250" stroke="#0039A6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="620" y="220" text-anchor="start" fill="#0039A6" font-size="12" font-weight="600">Vercel fetches source</text>

  <!-- ==================== STAGE 3: VERCEL BUILD SERVER ==================== -->
  <g transform="translate(450, 255)">
    <rect width="200" height="140" rx="12" fill="url(#card-bg)" stroke="#374151" stroke-width="1.5"/>
    <!-- Server icon -->
    <g transform="translate(72, 12)">
      <rect x="0" y="0" width="56" height="16" rx="3" fill="none" stroke="#0039A6" stroke-width="2"/>
      <circle cx="45" cy="8" r="3" fill="#0039A6"/>
      <rect x="0" y="20" width="56" height="16" rx="3" fill="none" stroke="#0039A6" stroke-width="2"/>
      <circle cx="45" cy="28" r="3" fill="#0039A6"/>
    </g>
    <text x="100" y="72" text-anchor="middle" fill="white" font-size="15" font-weight="600">Vercel Build Server</text>
    <text x="100" y="92" text-anchor="middle" fill="#9ca3af" font-size="11">Runs: npm run build</text>
    <text x="100" y="106" text-anchor="middle" fill="#9ca3af" font-size="11">Vite translates JSX → JS</text>
    <text x="100" y="120" text-anchor="middle" fill="#9ca3af" font-size="11">Tailwind → CSS</text>
    <text x="100" y="134" text-anchor="middle" fill="#9ca3af" font-size="11">Output: dist/ folder</text>
  </g>

  <!-- Arrow 3: Build → CDN (fans out) -->
  <path d="M450 370 Q350 420 200 470" fill="none" stroke="#6CBE45" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M550 395 L550 470" fill="none" stroke="#6CBE45" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M650 370 Q750 420 900 470" fill="none" stroke="#6CBE45" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="550" y="438" text-anchor="middle" fill="#6CBE45" font-size="12" font-weight="600">Distributes dist/ to CDN servers worldwide</text>

  <!-- ==================== STAGE 4: CDN SERVERS ==================== -->
  <!-- CDN Mumbai -->
  <g transform="translate(80, 480)">
    <rect width="180" height="90" rx="12" fill="url(#card-bg)" stroke="#374151" stroke-width="1.5"/>
    <g transform="translate(65, 10)">
      <circle cx="25" cy="14" r="12" fill="none" stroke="#6CBE45" stroke-width="1.5"/>
      <ellipse cx="25" cy="14" rx="12" ry="5" fill="none" stroke="#6CBE45" stroke-width="1"/>
      <line x1="25" y1="2" x2="25" y2="26" stroke="#6CBE45" stroke-width="1"/>
    </g>
    <text x="90" y="52" text-anchor="middle" fill="white" font-size="14" font-weight="600">CDN — Mumbai</text>
    <text x="90" y="70" text-anchor="middle" fill="#9ca3af" font-size="11">Nearest to India</text>
  </g>

  <!-- CDN London -->
  <g transform="translate(460, 480)">
    <rect width="180" height="90" rx="12" fill="url(#card-bg)" stroke="#374151" stroke-width="1.5"/>
    <g transform="translate(65, 10)">
      <circle cx="25" cy="14" r="12" fill="none" stroke="#6CBE45" stroke-width="1.5"/>
      <ellipse cx="25" cy="14" rx="12" ry="5" fill="none" stroke="#6CBE45" stroke-width="1"/>
      <line x1="25" y1="2" x2="25" y2="26" stroke="#6CBE45" stroke-width="1"/>
    </g>
    <text x="90" y="52" text-anchor="middle" fill="white" font-size="14" font-weight="600">CDN — London</text>
    <text x="90" y="70" text-anchor="middle" fill="#9ca3af" font-size="11">Nearest to Europe</text>
  </g>

  <!-- CDN Virginia -->
  <g transform="translate(840, 480)">
    <rect width="180" height="90" rx="12" fill="url(#card-bg)" stroke="#374151" stroke-width="1.5"/>
    <g transform="translate(65, 10)">
      <circle cx="25" cy="14" r="12" fill="none" stroke="#6CBE45" stroke-width="1.5"/>
      <ellipse cx="25" cy="14" rx="12" ry="5" fill="none" stroke="#6CBE45" stroke-width="1"/>
      <line x1="25" y1="2" x2="25" y2="26" stroke="#6CBE45" stroke-width="1"/>
    </g>
    <text x="90" y="52" text-anchor="middle" fill="white" font-size="14" font-weight="600">CDN — Virginia</text>
    <text x="90" y="70" text-anchor="middle" fill="#9ca3af" font-size="11">Nearest to US East</text>
  </g>

  <!-- Arrow 4: CDN → Users -->
  <line x1="170" y1="570" x2="170" y2="640" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="550" y1="570" x2="550" y2="640" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="930" y1="570" x2="930" y2="640" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- ==================== STAGE 5: USERS ==================== -->
  <!-- User India -->
  <g transform="translate(80, 650)">
    <rect width="180" height="100" rx="12" fill="url(#card-bg)" stroke="#7C3AED" stroke-width="1.5"/>
    <g transform="translate(73, 10)">
      <circle cx="17" cy="8" r="8" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
      <path d="M0 32 Q17 20 34 32" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
    </g>
    <text x="90" y="58" text-anchor="middle" fill="white" font-size="14" font-weight="600">User in India</text>
    <text x="90" y="76" text-anchor="middle" fill="#9ca3af" font-size="11">Browser downloads files</text>
    <text x="90" y="90" text-anchor="middle" fill="#9ca3af" font-size="11">Runs sims locally</text>
  </g>

  <!-- User UK -->
  <g transform="translate(460, 650)">
    <rect width="180" height="100" rx="12" fill="url(#card-bg)" stroke="#7C3AED" stroke-width="1.5"/>
    <g transform="translate(73, 10)">
      <circle cx="17" cy="8" r="8" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
      <path d="M0 32 Q17 20 34 32" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
    </g>
    <text x="90" y="58" text-anchor="middle" fill="white" font-size="14" font-weight="600">User in UK</text>
    <text x="90" y="76" text-anchor="middle" fill="#9ca3af" font-size="11">Browser downloads files</text>
    <text x="90" y="90" text-anchor="middle" fill="#9ca3af" font-size="11">Runs sims locally</text>
  </g>

  <!-- User USA -->
  <g transform="translate(840, 650)">
    <rect width="180" height="100" rx="12" fill="url(#card-bg)" stroke="#7C3AED" stroke-width="1.5"/>
    <g transform="translate(73, 10)">
      <circle cx="17" cy="8" r="8" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
      <path d="M0 32 Q17 20 34 32" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
    </g>
    <text x="90" y="58" text-anchor="middle" fill="white" font-size="14" font-weight="600">User in USA</text>
    <text x="90" y="76" text-anchor="middle" fill="#9ca3af" font-size="11">Browser downloads files</text>
    <text x="90" y="90" text-anchor="middle" fill="#9ca3af" font-size="11">Runs sims locally</text>
  </g>

  <!-- ==================== STAGE LABELS ==================== -->
  <text x="30" y="125" fill="#FF6319" font-size="11" font-weight="700" transform="rotate(-90, 30, 125)">STAGE 1</text>
  <text x="410" y="125" fill="#e5e7eb" font-size="11" font-weight="700" transform="rotate(-90, 410, 125)">STAGE 2</text>
  <text x="410" y="330" fill="#0039A6" font-size="11" font-weight="700" transform="rotate(-90, 410, 330)">STAGE 3</text>
  <text x="30" y="530" fill="#6CBE45" font-size="11" font-weight="700" transform="rotate(-90, 30, 530)">STAGE 4</text>
  <text x="30" y="705" fill="#7C3AED" font-size="11" font-weight="700" transform="rotate(-90, 30, 705)">STAGE 5</text>

  <!-- ==================== SIDE NOTE: What runs where ==================== -->
  <g transform="translate(780, 60)">
    <rect width="260" height="200" rx="12" fill="#1a1a2e" stroke="#374151" stroke-width="1" stroke-dasharray="6 3"/>
    <text x="130" y="28" text-anchor="middle" fill="#FCCC0A" font-size="13" font-weight="700">What runs WHERE?</text>
    <line x1="20" y1="38" x2="240" y2="38" stroke="#374151" stroke-width="1"/>

    <circle cx="30" cy="60" r="5" fill="#FF6319"/>
    <text x="42" y="65" fill="#e5e7eb" font-size="12">React sims, animations</text>
    <text x="42" y="80" fill="#9ca3af" font-size="11">→ User's browser</text>

    <circle cx="30" cy="105" r="5" fill="#0039A6"/>
    <text x="42" y="110" fill="#e5e7eb" font-size="12">JSX → JS translation</text>
    <text x="42" y="125" fill="#9ca3af" font-size="11">→ Vercel build server (once)</text>

    <circle cx="30" cy="150" r="5" fill="#6CBE45"/>
    <text x="42" y="155" fill="#e5e7eb" font-size="12">JAX code execution</text>
    <text x="42" y="170" fill="#9ca3af" font-size="11">→ MyBinder (external server)</text>

    <circle cx="30" cy="192" r="5" fill="#7C3AED"/>
    <text x="42" y="188" fill="#e5e7eb" font-size="12">File serving</text>
    <text x="42" y="203" fill="#9ca3af" font-size="11">→ Vercel CDN</text>
  </g>

  <!-- Bottom note -->
  <text x="550" y="790" text-anchor="middle" fill="#4b5563" font-size="12">Every arrow = a computer requesting something from another computer. Every box = a hard drive somewhere.</text>
  <text x="550" y="808" text-anchor="middle" fill="#4b5563" font-size="12">"The cloud" is just someone else's computer in a building you've never visited.</text>
</svg>

<div class="legend">
  <div class="legend-item">
    <svg width="16" height="16"><rect width="16" height="16" rx="3" fill="#FF6319"/></svg>
    You → GitHub
  </div>
  <div class="legend-item">
    <svg width="16" height="16"><rect width="16" height="16" rx="3" fill="#0039A6"/></svg>
    GitHub → Vercel
  </div>
  <div class="legend-item">
    <svg width="16" height="16"><rect width="16" height="16" rx="3" fill="#6CBE45"/></svg>
    Vercel → CDN
  </div>
  <div class="legend-item">
    <svg width="16" height="16"><rect width="16" height="16" rx="3" fill="#7C3AED"/></svg>
    CDN → Users
  </div>
</div>

</body>
</html>
